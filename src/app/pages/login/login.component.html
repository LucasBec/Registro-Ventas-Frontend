<div class="flex items-center justify-center min-h-screen bg-gray-100">
    <form
      [formGroup]="loginForm"
      (ngSubmit)="login()"
      class="bg-white shadow-lg rounded-xl p-8 space-y-6 w-full max-w-sm"
    >
      <h2 class="text-2xl font-semibold text-center text-gray-700">Iniciar sesión</h2>
  
      <div>
        <label class="block mb-1 text-gray-600">Email</label>
        <input
          type="email"
          formControlName="email"
          name="email"
          required
          class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
        />
      </div>
  
      <div>
        <label class="block mb-1 text-gray-600">Contraseña</label>
        <input
          type="password"
          formControlName="password"
          name="password"
          required
          class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
        />
      </div>
  
      <button
        type="submit"
        class="w-full bg-blue-600 hover:bg-blue-700 text-white py-2 rounded-lg transition cursor-pointer"
      >
        Ingresar
      </button>
    </form>
  </div>
