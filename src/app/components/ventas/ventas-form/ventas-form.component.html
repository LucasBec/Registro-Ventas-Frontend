<div class="max-h-screen overflow-y-auto bg-gray-100 p-6 space-y-4">
  <h2 class="flex items-center justify-center text-xl font-bold mb-4 text-gray-800">Registrar Venta</h2>

  <form #formulario="ngForm" (ngSubmit)="guardar()" class="space-y-4">

    <div>
      <label class="block">Comprador:</label>
      <input type="text" [(ngModel)]="venta.comprador" name="comprador" required #comprador="ngModel" class="input w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm bg-white focus:outline-none focus:ring-2 focus:ring-blue-500" />
      <p class="text-red-500 text-sm" *ngIf="comprador.invalid && comprador.touched">
        El nombre del comprador es obligatorio.
      </p>
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Modelo</label>
      <input type="text" [(ngModel)]="venta.modelo" name="modelo" required #modelo="ngModel" class="input w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm bg-white focus:outline-none focus:ring-2 focus:ring-blue-500" />
      <p class="text-red-500 text-sm" *ngIf="modelo.invalid && modelo.touched">
        El modelo es obligatorio.
      </p>
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Precio Venta</label>
        <input type="number" [(ngModel)]="venta.precioVenta" name="precioVenta" required min="1" #precioVenta="ngModel"
          class="input w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm bg-white focus:outline-none focus:ring-2 focus:ring-blue-500" />
        <p class="text-red-500 text-sm" *ngIf="precioVenta.invalid && precioVenta.touched">
          El precio debe ser mayor a 0.
        </p>
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Precio Compra</label>
        <input type="number" [(ngModel)]="venta.precioCompra" name="precioCompra" required min="1" #precioCompra="ngModel"
          class="input w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm bg-white focus:outline-none focus:ring-2 focus:ring-blue-500" />
        <p class="text-red-500 text-sm" *ngIf="precioCompra.invalid && precioCompra.touched">
          El precio debe ser mayor a 0.
        </p>
      </div>
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Forma de pago</label>
      <select [(ngModel)]="venta.formaPago" name="formaPago"
        class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm bg-white focus:outline-none focus:ring-2 focus:ring-blue-500">
        <option value="Efectivo">Efectivo</option>
        <option value="Tarjeta">Tarjeta</option>
        <option value="Transferencia">Transferencia</option>
        <option value="Cuotas">Cuotas</option>
      </select>
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Fecha</label>
      <input type="date" [(ngModel)]="venta.fecha" name="fecha" required #fecha="ngModel" class="input w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm bg-white focus:outline-none focus:ring-2 focus:ring-blue-500" />
      <p class="text-red-500 text-sm" *ngIf="fecha.invalid && fecha.touched">
        La fecha es obligatoria.
      </p>
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Plataforma</label>
      <select [(ngModel)]="venta.plataforma" name="plataforma"
        class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm bg-white focus:outline-none focus:ring-2 focus:ring-blue-500">
        <option value="Facebook">Facebook</option>
        <option value="Instagram">Instagram</option>
        <option value="WhatsApp">WhatsApp</option>
        <option value="Otro">Otro</option>
      </select>
    </div>

    <div class="flex items-center">
      <input type="checkbox" [(ngModel)]="venta.confirmada" name="confirmada"
        class="h-6 w-6 text-blue-600 focus:ring-blue-500 border-gray-300 rounded cursor-pointer" />
      <label class="ml-2 text-base font-medium text-gray-700 ">Confirmada?</label>
    </div>

    <div class="flex justify-end gap-2 pt-2">
      <button type="button" (click)="dialogRef.close()"
        class="px-4 py-2 border border-gray-300 rounded-md text-gray-700 hover:bg-gray-100 transition">Cancelar</button>
      <button mat-raised-button color="primary" type="submit" [disabled]="formulario.invalid" class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 transition font-semibold">
        Guardar
      </button>
    </div>
  </form>
</div>
